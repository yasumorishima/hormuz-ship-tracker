name: Collect AIS window

# aisstream.io only pushes, so there is no endpoint to poll for "the current
# fleet". This opens the stream for a few minutes, keeps one position per
# vessel, and writes that sample to the Hub dataset. It is a sample of the
# fleet, not a continuous track — see docs/PIPELINE.md.

on:
  schedule:
    # Off the hour on purpose: scheduled runs are delayed most at :00.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string
      seconds:
        description: 'how long to hold the connection'
        required: false
        default: '180'
        type: string
      probe:
        description: 'measure only, upload nothing'
        required: false
        default: false
        type: boolean
      bbox:
        description: 'override the bounding box, as JSON, for a diagnostic run'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: hormuz-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIGURED: >-
        ${{ secrets.AISSTREAM_API_KEY != '' && secrets.HF_TOKEN != '' }}
    steps:
      - name: Skip while the secrets are unset
        if: env.CONFIGURED != 'true'
        run: |
          echo "::warning::AISSTREAM_API_KEY / HF_TOKEN are not set on this repository, so there is nothing this run can do. See docs/PIPELINE.md."

      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'

      - uses: actions/setup-python@v5
        if: env.CONFIGURED == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-collect.txt

      - if: env.CONFIGURED == 'true'
        run: pip install -r requirements-collect.txt

      - name: Collect one window
        if: env.CONFIGURED == 'true'
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Via env, never interpolated into the script itself.
          WINDOW_SECONDS: ${{ inputs.seconds || '180' }}
          AIS_BBOX: ${{ inputs.bbox }}
          PROBE_FLAG: ${{ inputs.probe && '--probe' || '' }}
        run: |
          set -o pipefail   # without this the exit status would be tee's
          python src/window_collect.py --seconds "$WINDOW_SECONDS" $PROBE_FLAG \
            | tee "$RUNNER_TEMP/window.json"

      - name: Summary
        if: always() && env.CONFIGURED == 'true'
        run: |
          {
            echo '### Collection window'
            echo '```json'
            cat "$RUNNER_TEMP/window.json" 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
