name: Publish snapshot

# Rebuilds a working database from the Hub dataset, re-renders the snapshot,
# heatmap and stats, and commits them to docs/.
#
# Only `positions` is rebuilt. The analytics engine (transit detection) does
# not run in this pipeline — see docs/PIPELINE.md.
#
# The scheduled workflows in this repository would be disabled after 60 days
# without repository activity, so this also re-asserts them explicitly rather
# than relying on its own commit to reset the timer.

on:
  schedule:
    - cron: '13 */3 * * *'
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string
      hours:
        description: 'how far back to load and render'
        required: false
        default: '48'
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  # Shared with compact.yml: both touch the Hub dataset, and compaction
  # deleting a shard mid-publish would fail the download.
  group: hormuz-hub
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AIS_DB_PATH: ${{ github.workspace }}/work/ais.db
      AIS_OUTPUT_DIR: ${{ github.workspace }}/work
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      LOAD_HOURS: ${{ inputs.hours || '48' }}
      CONFIGURED: ${{ secrets.HF_TOKEN != '' }}
    steps:
      - name: Skip while HF_TOKEN is unset
        if: env.CONFIGURED != 'true'
        run: |
          echo "::warning::HF_TOKEN is not set on this repository, so there is nothing this run can do. See docs/PIPELINE.md."

      - uses: actions/checkout@v4
        if: env.CONFIGURED == 'true'
        with:
          # The credential is not needed until the push, and pip runs first.
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: env.CONFIGURED == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-publish.txt

      - if: env.CONFIGURED == 'true'
        run: pip install -r requirements-publish.txt

      - name: Rebuild the working database from the Hub
        if: env.CONFIGURED == 'true'
        run: |
          set -o pipefail   # without this the exit status would be tee's
          mkdir -p work
          python src/build_db.py --hours "$LOAD_HOURS" --db "$AIS_DB_PATH"             | tee "$RUNNER_TEMP/build.json"
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/build.json") as f:
              print("LOADED_ROWS=%d" % json.load(f)["rows"])
          PY

      - name: Nothing to publish
        if: env.CONFIGURED == 'true' && env.LOADED_ROWS == '0'
        run: |
          echo "::warning::the last ${LOAD_HOURS}h of the dataset hold no positions, so there is nothing to render. While the feed has no coverage for this area that is the expected state, not a fault here."


      - name: Render snapshot, heatmap and stats
        if: env.CONFIGURED == 'true' && env.LOADED_ROWS != '0'
        run: |
          python src/snapshot.py "$AIS_DB_PATH" "$AIS_OUTPUT_DIR"
          # --hours must match what was loaded, or the caption claims more
          # than the database holds.
          python src/heatmap.py --db "$AIS_DB_PATH" --output-dir "$AIS_OUTPUT_DIR" \
            --hours "$LOAD_HOURS" --filename heatmap.png
          python src/stats_report.py --db "$AIS_DB_PATH" --output docs/STATS.md

      - name: Copy whatever was rendered into docs/
        if: env.CONFIGURED == 'true' && env.LOADED_ROWS != '0'
        run: |
          # A renderer can decide there is nothing to draw and exit 0 without
          # writing a file; that is not a reason to fail the job here.
          if [ -f work/snapshot.png ]; then cp work/snapshot.png docs/snapshot_latest.png; fi
          if [ -f work/snapshot_stats.txt ]; then cp work/snapshot_stats.txt docs/snapshot_stats.txt; fi
          if [ -f work/heatmap.png ]; then cp work/heatmap.png docs/heatmap.png; fi
          ls -l docs/

      - name: Commit if anything changed
        if: env.CONFIGURED == 'true' && env.LOADED_ROWS != '0'
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'hormuz-bot'
          git config user.email 'hormuz-bot@users.noreply.github.com'
          git add docs/snapshot_latest.png docs/snapshot_stats.txt \
                  docs/heatmap.png docs/STATS.md
          if git diff --cached --quiet; then
            echo 'No change to publish'
            exit 0
          fi
          VESSELS=$(grep -oP 'Active vessels.*?: \K[0-9]+' docs/snapshot_stats.txt || echo '?')
          git commit -m "snapshot: ${VESSELS} vessels at $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Passed on the command line rather than written into .git/config,
          # and anything else landing on the branch between checkout and push
          # would otherwise redden the run.
          REMOTE="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase --autostash "$REMOTE" "$GITHUB_REF_NAME"
          git push "$REMOTE" "HEAD:$GITHUB_REF_NAME"

      - name: Re-assert the scheduled workflows
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in collect.yml compact.yml publish.yml sar-collect.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" \
              && echo "enabled $wf" || echo "::warning::could not re-assert $wf"
          done
