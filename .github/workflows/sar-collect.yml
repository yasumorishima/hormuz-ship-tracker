name: Collect SAR scenes

# The AIS feed has no receiver anywhere near the strait: a 180-second global
# subscription on 2026-09-16 and again on 2026-09-17 saw 12,312 and 9,547
# vessels worldwide and none inside the box. Sentinel-1 does cover it — eight
# scenes over the centre of the strait in sixteen days — and a radar sees a
# hull whether or not it is transmitting.
#
# Nothing here needs an account: Planetary Computer answers both the search
# and the SAS signing anonymously. The only secret is the one that writes to
# the Hub, the same as the AIS side.

on:
  schedule:
    # Daily, though the satellites come round every two days or so. A run with
    # nothing to do costs a minute and the window overlaps itself, so a missed
    # firing is picked up by the next one rather than lost.
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string
      hours:
        description: 'how far back to look for scenes'
        required: false
        default: '72'
        type: string
      max_scenes:
        description: 'stop after this many scenes'
        required: false
        default: '4'
        type: string
      dry_run:
        description: 'process but write nothing to the Hub'
        required: false
        default: false
        type: boolean
      redo:
        description: 'process scenes already done, overwriting their files'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # Shared with compact.yml and publish.yml: they all commit to the same Hub
  # dataset, and a commit landing while another job is listing it is how a
  # file gets read after it was replaced.
  group: hormuz-hub
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONFIGURED: ${{ secrets.HF_TOKEN != '' }}
    steps:
      - name: Skip while the token is unset
        if: env.CONFIGURED != 'true' && inputs.dry_run != true
        run: |
          echo "::warning::HF_TOKEN is not set on this repository, so there is nowhere to write. See docs/PIPELINE.md."

      - uses: actions/checkout@v4
        with:
          # Nothing here pushes, and the job installs third-party packages
          # afterwards; leaving the token in .git/config would put it within
          # reach of install-time code for no benefit.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-sar.txt

      - run: pip install -r requirements-sar.txt

      - name: Process the new scenes
        if: env.CONFIGURED == 'true' || inputs.dry_run == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HOURS: ${{ inputs.hours || '72' }}
          MAX_SCENES: ${{ inputs.max_scenes || '4' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          REDO: ${{ inputs.redo && '--redo' || '' }}
        run: |
          set -o pipefail
          python src/sar_collect.py --hours "$HOURS" --max-scenes "$MAX_SCENES" \
            $DRY_RUN $REDO | tee "$RUNNER_TEMP/sar.json"

      - name: Summary
        if: always()
        run: |
          {
            echo '### SAR scenes'
            echo '```json'
            cat "$RUNNER_TEMP/sar.json" 2>/dev/null || echo '(no output)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
