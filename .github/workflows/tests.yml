name: Tests

# The parser and backfill tests stub out land_filter and need no third-party
# packages. The window-loop test stands up a local WebSocket server in place
# of aisstream.io, so the one part that cannot be checked by reading it is
# checked before it ever runs against the live stream.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt

      - run: pip install -r requirements-test.txt

      - name: Unit tests
        run: |
          python - <<'PY'
          import sys, unittest
          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          # A skip here means the environment lost a package, not that the
          # test was optional. Green-because-absent is the failure mode this
          # step exists to prevent.
          for case, reason in result.skipped:
              print(f"::error::{case} was skipped: {reason}")
          sys.exit(1 if (result.skipped or not result.wasSuccessful()) else 0)
          PY

      - name: Every module compiles
        run: python -m compileall -q src tests

      - name: Workflows parse
        run: |
          python - <<'PY'
          import glob, yaml
          for path in sorted(glob.glob(".github/workflows/*.yml")):
              doc = yaml.safe_load(open(path))
              assert doc.get("jobs"), path
              print("ok", path)
          PY
